services:
  trader:
    build: .
    image: claude-trader:local
    container_name: claude-trader
    # riparte da solo dopo un crash o un riavvio della macchina
    restart: unless-stopped
    # processo 1 corretto: inoltra i segnali e raccoglie i processi figli (claude -p)
    init: true
    # allo stop lascia finire la sveglia in corso (il cervello può metterci qualche minuto)
    stop_grace_period: 5m
    # chiavi: file .env (vedi deploy/trader.env.example e deploy/aws/fetch-env.sh). Mai in git.
    env_file: .env
    environment:
      TZ: Europe/Rome
    volumes:
      # testimone, lucchetto, storia: devono sopravvivere ai riavvii del container
      - trader-state:/app/state
      - trader-logs:/app/logs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  trader-state:
  trader-logs:
